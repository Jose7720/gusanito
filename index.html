<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gusanito Mini App</title>
    <!-- SDK de Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #222);
            color: var(--tg-theme-text-color, #fff);
            overflow: hidden; /* Evita scroll en móvil */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
        }

        canvas {
            background-color: #000;
            border: 4px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 8px;
            display: block;
        }

        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Botones de control para celular */
        #controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 80%;
            max-width: 300px;
        }

        .ctrl-btn {
            padding: 20px;
            font-size: 24px;
            border: none;
            border-radius: 50%;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
            touch-action: manipulation; /* Mejora respuesta táctil */
        }

        .ctrl-btn:active {
            opacity: 0.7;
        }

        /* Posicionamiento de botones en la cuadrícula */
        #btn-up    { grid-column: 2; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

    </style>
</head>
<body>

    <div id="score-board">Puntos: <span id="score">0</span></div>
    
    <div id="game-container">
        <!-- El lienzo donde se dibuja el juego -->
        <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <!-- Controles táctiles -->
    <div id="controls">
        <button class="ctrl-btn" id="btn-up" onclick="changeDirection('up')">↑</button>
        <button class="ctrl-btn" id="btn-left" onclick="changeDirection('left')">←</button>
        <button class="ctrl-btn" id="btn-right" onclick="changeDirection('right')">→</button>
        <button class="ctrl-btn" id="btn-down" onclick="changeDirection('down')">↓</button>
    </div>

    <script>
        // --- Configuración e Inicialización de Telegram ---
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- Configuración del Juego ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 16; // Tamaño de cada cuadrado (gusanito y comida)
        const tileCount = canvas.width / gridSize; // Cuántos cuadrados caben (20x20)
        
        let score = 0;
        let gameInterval;
        let gameSpeed = 150; // Milisegundos entre actualizaciones (más bajo = más rápido)

        // Estado inicial del gusanito (array de posiciones x,y)
        let snake = [
            { x: 10, y: 10 }, // Cabeza
            { x: 9, y: 10 }
        ];

        // Estado inicial de la comida
        let food = { x: 5, y: 5 };

        // Dirección actual
        let velocity = { x: 1, y: 0 }; // Empezar moviéndose a la derecha
        let nextVelocity = { x: 1, y: 0 }; // Para evitar giros de 180º

        // --- Funciones Principales ---

        function startGame() {
            placeFood();
            score = 0;
            scoreElement.innerText = score;
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }];
            nextVelocity = { x: 1, y: 0 };
            velocity = { x: 1, y: 0 };
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        // El bucle principal del juego (se ejecuta cada 'gameSpeed' ms)
        function gameLoop() {
            update();
            draw();
        }

        // Actualizar la lógica (movimiento, colisiones)
        function update() {
            velocity = nextVelocity; // Actualizar dirección antes de mover

            // Calcular nueva posición de la cabeza
            const head = { 
                x: snake[0].x + velocity.x, 
                y: snake[0].y + velocity.y 
            };

            // Colisión con paredes (Game Over)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // Colisión con el propio cuerpo (Game Over)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            // Añadir la nueva cabeza al principio del array
            snake.unshift(head);

            // Verificar si come la comida
            if (head.x === food.x && head.y === food.y) {
                // Sí come: No quitamos la cola (crece), aumentamos puntos y reubicamos comida
                score += 10;
                scoreElement.innerText = score;
                placeFood();
                // Haptic feedback de Telegram si está disponible
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                // No come: Quitamos el último segmento (la cola) para simular movimiento
                snake.pop();
            }
        }

        // Dibujar todo en el canvas
        function draw() {
            // 1. Limpiar el fondo
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Dibujar la comida
            ctx.fillStyle = '#ff4444'; // Rojo comida
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // 3. Dibujar el gusanito
            ctx.fillStyle = '#44ff44'; // Verde gusanito
            snake.forEach((segment, index) => {
                // Hacer la cabeza un poco diferente si quieres
                if (index === 0) ctx.fillStyle = '#ccffcc';
                else ctx.fillStyle = '#44ff44';

                // gridSize - 2 crea un pequeño borde negro entre segmentos
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // Reubicar la comida en un lugar aleatorio vacío
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                // Verificar que no aparezca sobre el cuerpo del gusanito
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            
            ctx.fillStyle = 'white';
            ctx.font = '30px Courier New';
            ctx.fillText("¡GAME OVER!", canvas.width / 2 - 80, canvas.height / 2);
            ctx.font = '20px Courier New';
            ctx.fillText("Puntos: " + score, canvas.width / 2 - 50, canvas.height / 2 + 30);
            
            // Mostrar botón de cierre de Telegram
            tg.MainButton.setText('Reiniciar Juego');
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                tg.MainButton.hide();
                startGame();
            });
        }

        // Manejo de controles táctiles
        function changeDirection(direction) {
            switch(direction) {
                case 'up':
                    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }

        // Comenzar el juego al cargar
        startGame();

    </script>
</body>
</html>
